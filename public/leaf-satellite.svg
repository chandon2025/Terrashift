<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D91" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="44" fill="#F4F7F4" stroke="#2E7D32" stroke-width="2"/>
  <!-- Orbit track -->
  <ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="#0B3D91" stroke-width="1.8" stroke-dasharray="4 2" transform="rotate(-28 50 50)" opacity="0.7"/>
  <!-- Earth / Base -->
  <path d="M 22 66 C 30 52, 70 52, 78 66 C 70 78, 30 78, 22 66 Z" fill="#E0E7E0" opacity="0.6"/>
  <!-- Sprout / Leaf -->
  <path d="M 50 64 C 50 48, 38 42, 38 42 C 44 48, 47 56, 49 64 Z" fill="url(#leafGrad)"/>
  <path d="M 50 64 C 52 44, 66 38, 66 38 C 60 46, 56 56, 51 64 Z" fill="#2E7D32"/>
  <circle cx="50" cy="65" r="2.5" fill="#4E342E"/>
  <!-- Satellite -->
  <g transform="translate(74, 26) rotate(25)">
    <rect x="-4" y="-3" width="8" height="6" rx="1.5" fill="#0B3D91"/>
    <rect x="-10" y="-2" width="5" height="4" rx="0.5" fill="#FF8F00"/>
    <rect x="5" y="-2" width="5" height="4" rx="0.5" fill="#FF8F00"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>

